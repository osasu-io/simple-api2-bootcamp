<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
</head>

<body>

    <h1>Movie Info Finder</h1>
    <input type="text" id="movieInput" placeholder="Enter movie title">
    <button id="searchButton">Search</button>

    <div id="movieResult" style="display: none; margin-top: 20px;">
        <h2 id="movieTitle"></h2>
        <p><strong>Year:</strong> <span id="movieYear"></span></p>
        <p><strong>Plot:</strong> <span id="moviePlot"></span></p>
        <img id="moviePoster" src="" alt="Movie Poster" style="width: 200px;">
    </div>

    <script src="js/app.js"></script>
</body>

</html>
